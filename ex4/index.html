<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CADT Shop</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        h2 {
            color: #222;
        }
        table {
            width: 70%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            border: 1px solid #444;
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #d3d3d3;
        }
        img.thumbnail {
            width: 40px;
            height: auto;
        }
    </style>
</head>
<body>

    <h2>Welcome to CADT Shop!</h2>

    <table>
        <thead>
            <tr>
                <th>Thumbnail</th>
                <th>Product Name</th>
                <th>Price</th>
                <th>Quantity</th>
                <th>In Stock</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td><img src="book.png" alt="C# Book" class="thumbnail"></td>
                <td>C# Book</td>
                <td>$10</td>
                <td>5</td>
                <td>YES</td>
            </tr>
            <tr>
                <td><img src="polo.png" alt="CADT Polo" class="thumbnail"></td>
                <td>CADT Polo</td>
                <td>$12</td>
                <td>60</td>
                <td>YES</td>
            </tr>
            <tr>
                <td><img src="mouse.png" alt="CADT mouse" class="thumbnail"></td>
                <td>CADT mouse</td>
                <td>$100</td>
                <td>3</td>
                <td>NO</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
